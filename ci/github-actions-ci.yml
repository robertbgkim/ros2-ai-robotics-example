name: colcon build and test

# 예제 저장소 전체 패키지의 빌드·테스트
# 실행 조건: main 푸시와 모든 PR
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # ROS 2 Lyrical Luth가 설치된 공식 컨테이너
    container:
      image: ros:lyrical-ros-base

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          path: src/ros2-ai-robotics-example

      - name: 의존성 설치
        shell: bash
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src --rosdistro lyrical -r -y

      - name: 빌드
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          colcon build --symlink-install

      - name: 테스트
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          source install/setup.bash

          # colcon test가 실패해도 결과 요약까지 본 뒤에 판정
          test_status=0
          result_status=0
          colcon test || test_status=$?
          colcon test-result --verbose || result_status=$?

          if [ "$test_status" -ne 0 ] || [ "$result_status" -ne 0 ]; then
            exit 1
          fi
